aid: thought-industries
name: Thought Industries
description: >-
  Thought Industries is a B2B learning platform (LMS/LXP) providing REST and GraphQL APIs for programmatic access to
  courses, users, enrollments, content management, and reporting. Their developer portal enables integration of learning
  experiences into enterprise workflows with webhook support and comprehensive API coverage for user lifecycle, content,
  and analytics.
